id: ttf_gas_daily
namespace: ttf
description: Daily TTF extract, lake, warehouse, dbt

tasks:
  - id: extract
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - ttf-gas-pipeline_project-code:/app
    containerImage: python:3.12-slim
    commands:
      - pip install -q pandas pyarrow dbnomics
      - python /app/ingest/extract_ttf.py

  - id: transform
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - ttf-gas-pipeline_project-code:/app
    containerImage: python:3.12-slim
    commands:
      - pip install -q pandas pyarrow
      - python /app/ingest/transform_panel.py

  - id: load_gcs
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - ttf-gas-pipeline_project-code:/app
        - ttf-gas-pipeline_gcloud-config:/root/.config/gcloud
    containerImage: python:3.12-slim
    commands:
      - pip install -q google-cloud-storage
      - python /app/ingest/load_gcs.py

  - id: load_bq
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - ttf-gas-pipeline_project-code:/app
        - ttf-gas-pipeline_gcloud-config:/root/.config/gcloud
    containerImage: python:3.12-slim
    commands:
      - pip install -q google-cloud-bigquery pandas pyarrow
      - python /app/ingest/load_bq.py

  - id: dbt_run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - ttf-gas-pipeline_project-code:/app
    containerImage: python:3.12-slim
    commands:
      - pip install -q dbt-bigquery
      - export GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
      - dbt run --project-dir /app/dbt/ttf_gas --profiles-dir /app/dbt/ttf_gas

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"